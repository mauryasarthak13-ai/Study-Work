<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1-4-7 Spaced Repetition Tracker</title>
    
    <!-- Tailwind CSS (For Styling) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel (To compile React JSX in the browser) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            background-color: #020617; /* slate-950 */
            color: #f1f5f9; /* slate-100 */
            margin: 0;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
    </style>
</head>
<body>
    <!-- The React App will inject here -->
    <div id="root"></div>

    <script type="text/babel">
        // Destructure React Hooks from the global React object
        const { useState, useEffect, useMemo } = window.React;

        // --- Sound Synthesizer via Web Audio API ---
        const playAudioEffect = (type = 'success') => {
          try {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (!AudioCtx) return;
            const ctx = new AudioCtx();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);

            if (type === 'success') {
              osc.type = 'sine';
              osc.frequency.setValueAtTime(523.25, ctx.currentTime); 
              osc.frequency.exponentialRampToValueAtTime(659.25, ctx.currentTime + 0.1); 
              osc.frequency.exponentialRampToValueAtTime(783.99, ctx.currentTime + 0.2); 
              gain.gain.setValueAtTime(0.2, ctx.currentTime);
              gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
              osc.start();
              osc.stop(ctx.currentTime + 0.4);
            }
          } catch (e) {
            console.log("Audio blocked by browser");
          }
        };

        // --- Helper Date Functions ---
        const formatDateISO = (date = new Date()) => {
          const d = new Date(date);
          const month = '' + (d.getMonth() + 1);
          const day = '' + d.getDate();
          const year = d.getFullYear();
          return [year, month.padStart(2, '0'), day.padStart(2, '0')].join('-');
        };

        const addDaysToISO = (isoDateStr, days) => {
          const d = new Date(isoDateStr);
          d.setDate(d.getDate() + days);
          return formatDateISO(d);
        };

        function App() {
          const [topics, setTopics] = useState(() => {
            const saved = localStorage.getItem('study_147_topics');
            return saved ? JSON.parse(saved) : [];
          });

          const [stats, setStats] = useState(() => {
            const saved = localStorage.getItem('study_147_stats');
            return saved ? JSON.parse(saved) : { xp: 0, level: 1, streak: 0 };
          });

          const [activeTab, setActiveTab] = useState('home');
          const [isAddModalOpen, setIsAddModalOpen] = useState(false);
          const [isRevisionModalOpen, setIsRevisionModalOpen] = useState(false);
          const [activeRevisionTask, setActiveRevisionTask] = useState(null);
          
          const [newTopic, setNewTopic] = useState({ subject: 'General', title: '', notes: '' });

          useEffect(() => localStorage.setItem('study_147_topics', JSON.stringify(topics)), [topics]);
          useEffect(() => localStorage.setItem('study_147_stats', JSON.stringify(stats)), [stats]);

          const todayStr = formatDateISO();

          const todayRevisions = useMemo(() => {
            const list = [];
            topics.forEach(t => {
              if (t.archived) return;
              if (t.day1Date <= todayStr && !t.day1Completed) list.push({ ...t, stage: 1, isOverdue: t.day1Date < todayStr });
              else if (t.day1Completed && t.day4Date <= todayStr && !t.day4Completed) list.push({ ...t, stage: 4, isOverdue: t.day4Date < todayStr });
              else if (t.day4Completed && t.day7Date <= todayStr && !t.day7Completed) list.push({ ...t, stage: 7, isOverdue: t.day7Date < todayStr });
            });
            return list;
          }, [topics, todayStr]);

          const addXP = (amount) => {
            playAudioEffect('success');
            setStats(prev => ({
              ...prev,
              xp: prev.xp + amount,
              level: Math.floor((prev.xp + amount) / 200) + 1
            }));
          };

          const handleCreateTopic = (e) => {
            e.preventDefault();
            if (!newTopic.title.trim()) return;
            const created = formatDateISO();
            
            setTopics(prev => [{
              id: 'topic-' + Date.now(),
              ...newTopic,
              createdAt: created,
              day1Date: created,
              day4Date: addDaysToISO(created, 3),
              day7Date: addDaysToISO(created, 6),
              day1Completed: false, day4Completed: false, day7Completed: false, archived: false
            }, ...prev]);
            
            setNewTopic({ subject: 'General', title: '', notes: '' });
            setIsAddModalOpen(false);
          };

          const handleCompleteRevision = (topicId, stage) => {
            setTopics(prev => prev.map(t => {
              if (t.id === topicId) {
                if (stage === 1) return { ...t, day1Completed: true };
                if (stage === 4) return { ...t, day4Completed: true };
                if (stage === 7) return { ...t, day7Completed: true };
              }
              return t;
            }));
            addXP(stage === 7 ? 80 : 30);
            setIsRevisionModalOpen(false);
          };

          const handleDeleteTopic = (id) => {
            if(confirm('Delete this topic?')) {
              setTopics(prev => prev.filter(t => t.id !== id));
            }
          };

          return (
            <div className="min-h-screen flex flex-col md:flex-row antialiased">
              
              {/* Sidebar Navigation */}
              <aside className="w-full md:w-64 bg-slate-900 border-b md:border-b-0 md:border-r border-slate-800 flex md:flex-col justify-between shrink-0 sticky top-0 z-40">
                <div>
                  <div className="p-4 md:p-6 flex items-center justify-between border-b border-slate-800/60">
                    <div className="flex items-center space-x-3">
                      <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-purple-500 flex items-center justify-center font-black text-xl shadow-lg">147</div>
                      <div>
                        <h1 className="font-bold text-base leading-tight text-white">Revision 147</h1>
                        <p className="text-xs text-slate-400">Spaced Memory Tracker</p>
                      </div>
                    </div>
                  </div>

                  <nav className="p-2 md:p-4 space-x-2 md:space-x-0 md:space-y-2 flex md:block overflow-x-auto">
                    {[
                      { id: 'home', label: 'Dashboard', badge: todayRevisions.length },
                      { id: 'topics', label: 'All Topics', badge: 0 },
                    ].map(item => (
                      <button
                        key={item.id}
                        onClick={() => setActiveTab(item.id)}
                        className={`w-full flex items-center justify-between px-4 py-3 rounded-xl text-sm font-medium transition-all ${
                          activeTab === item.id ? 'bg-indigo-600/20 text-indigo-300 border border-indigo-500/30' : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200'
                        }`}
                      >
                        <span>{item.label}</span>
                        {item.badge > 0 && <span className="ml-2 px-2 py-1 text-xs font-bold rounded-full bg-rose-500/20 text-rose-400">{item.badge}</span>}
                      </button>
                    ))}
                  </nav>
                </div>

                <div className="hidden md:block p-4 border-t border-slate-800">
                  <button onClick={() => setIsAddModalOpen(true)} className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 px-4 rounded-xl shadow-lg transition text-sm">
                    + Add New Topic
                  </button>
                </div>
              </aside>

              {/* Main Content */}
              <main className="flex-1 overflow-y-auto p-4 md:p-8 space-y-6 max-w-5xl mx-auto w-full">
                <div className="flex justify-between items-center pb-4 border-b border-slate-800">
                  <h2 className="text-2xl font-extrabold text-white">{activeTab === 'home' ? '📅 Dashboard' : '📚 All Topics'}</h2>
                  <button onClick={() => setIsAddModalOpen(true)} className="md:hidden bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-sm px-4 py-2 rounded-xl">
                    + Add
                  </button>
                </div>

                {activeTab === 'home' && (
                  <div className="space-y-6">
                    <div className="grid grid-cols-2 md:grid-cols-3 gap-4">
                      <div className="bg-slate-900 p-4 rounded-2xl border border-slate-800">
                        <div className="text-slate-400 text-xs font-semibold uppercase">Due Today</div>
                        <div className="text-3xl font-black text-rose-400 mt-1">{todayRevisions.length}</div>
                      </div>
                      <div className="bg-slate-900 p-4 rounded-2xl border border-slate-800">
                        <div className="text-slate-400 text-xs font-semibold uppercase">Total XP</div>
                        <div className="text-3xl font-black text-amber-400 mt-1">{stats.xp}</div>
                      </div>
                      <div className="bg-slate-900 p-4 rounded-2xl border border-slate-800">
                        <div className="text-slate-400 text-xs font-semibold uppercase">Total Topics</div>
                        <div className="text-3xl font-black text-indigo-400 mt-1">{topics.length}</div>
                      </div>
                    </div>

                    <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4">
                      <h3 className="text-lg font-bold text-white">Revisions Scheduled For Today</h3>
                      {todayRevisions.length === 0 ? (
                        <div className="text-center py-10 text-slate-400 bg-slate-950 rounded-xl border border-slate-800">
                          🎉 You are all caught up for today!
                        </div>
                      ) : (
                        <div className="grid gap-4 md:grid-cols-2">
                          {todayRevisions.map(item => (
                            <div key={item.id} className="p-4 rounded-xl bg-slate-950 border border-slate-800 flex justify-between items-center">
                              <div>
                                <div className="text-[10px] text-indigo-400 font-bold uppercase mb-1">Day {item.stage} Revision</div>
                                <h4 className="text-base font-bold text-white">{item.title}</h4>
                              </div>
                              <button onClick={() => { setActiveRevisionTask(item); setIsRevisionModalOpen(true); }} className="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-4 py-2 rounded-lg">
                                Revise
                              </button>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  </div>
                )}

                {activeTab === 'topics' && (
                  <div className="space-y-4">
                    {topics.length === 0 ? (
                        <p className="text-slate-400 p-5 bg-slate-900 rounded-xl">No topics added yet. Click "Add New Topic" to start.</p>
                    ) : topics.map(topic => (
                      <div key={topic.id} className="bg-slate-900 border border-slate-800 rounded-xl p-5 relative">
                        <button onClick={() => handleDeleteTopic(topic.id)} className="absolute top-4 right-4 text-slate-500 hover:text-rose-500 font-bold text-sm">✕ Delete</button>
                        <h3 className="text-base font-bold text-white mb-1">{topic.title}</h3>
                        <p className="text-xs text-slate-400 mb-4">{topic.notes}</p>
                        
                        <div className="grid grid-cols-3 gap-2 mt-4 text-center text-xs font-bold">
                          <div className={`p-2 rounded-lg border ${topic.day1Completed ? 'bg-emerald-900/50 border-emerald-500/30 text-emerald-400' : 'bg-slate-800 border-slate-700 text-slate-400'}`}>
                            Day 1<br/><span className="text-[10px] opacity-80">{topic.day1Date}</span><br/>{topic.day1Completed ? '✅' : '⏳'}
                          </div>
                          <div className={`p-2 rounded-lg border ${topic.day4Completed ? 'bg-emerald-900/50 border-emerald-500/30 text-emerald-400' : 'bg-slate-800 border-slate-700 text-slate-400'}`}>
                            Day 4<br/><span className="text-[10px] opacity-80">{topic.day4Date}</span><br/>{topic.day4Completed ? '✅' : '⏳'}
                          </div>
                          <div className={`p-2 rounded-lg border ${topic.day7Completed ? 'bg-emerald-900/50 border-emerald-500/30 text-emerald-400' : 'bg-slate-800 border-slate-700 text-slate-400'}`}>
                            Day 7<br/><span className="text-[10px] opacity-80">{topic.day7Date}</span><br/>{topic.day7Completed ? '✅' : '⏳'}
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </main>

              {/* Add Modal */}
              {isAddModalOpen && (
                <div className="fixed inset-0 z-50 bg-slate-950/80 flex items-center justify-center p-4">
                  <div className="bg-slate-900 border border-slate-800 w-full max-w-md rounded-2xl p-6 shadow-2xl">
                    <h3 className="text-lg font-bold text-white mb-4">Add New Topic</h3>
                    <form onSubmit={handleCreateTopic} className="space-y-4">
                      <input type="text" required placeholder="Topic Title (e.g., Photosynthesis)" value={newTopic.title} onChange={e => setNewTopic({ ...newTopic, title: e.target.value })} className="w-full bg-slate-950 border border-slate-800 text-white text-sm rounded-xl p-3 focus:outline-none focus:border-indigo-500" />
                      <textarea placeholder="Notes (Optional)" value={newTopic.notes} onChange={e => setNewTopic({ ...newTopic, notes: e.target.value })} className="w-full bg-slate-950 border border-slate-800 text-white text-sm rounded-xl p-3 focus:outline-none focus:border-indigo-500"></textarea>
                      <div className="flex gap-2 pt-2">
                        <button type="button" onClick={() => setIsAddModalOpen(false)} className="w-full bg-slate-800 text-white font-bold py-3 rounded-xl text-sm hover:bg-slate-700">Cancel</button>
                        <button type="submit" className="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl text-sm hover:bg-indigo-500">Save Topic</button>
                      </div>
                    </form>
                  </div>
                </div>
              )}

              {/* Revision Modal */}
              {isRevisionModalOpen && activeRevisionTask && (
                <div className="fixed inset-0 z-50 bg-slate-950/80 flex items-center justify-center p-4">
                  <div className="bg-slate-900 border border-slate-800 w-full max-w-md rounded-2xl p-6 shadow-2xl text-center">
                    <div className="text-xs text-indigo-400 font-bold uppercase mb-1">Day {activeRevisionTask.stage} Recall Test</div>
                    <h3 className="text-xl font-bold text-white mb-3">{activeRevisionTask.title}</h3>
                    <div className="bg-slate-950 p-4 rounded-xl border border-slate-800 mb-6 text-left">
                        <span className="text-[10px] text-slate-500 uppercase block mb-1">Your Notes:</span>
                        <p className="text-slate-300 text-sm">{activeRevisionTask.notes || 'No notes available for this topic.'}</p>
                    </div>
                    
                    <button onClick={() => handleCompleteRevision(activeRevisionTask.id, activeRevisionTask.stage)} className="w-full bg-emerald-600 hover:bg-emerald-500 transition text-white font-bold py-3 rounded-xl text-sm shadow-lg shadow-emerald-900/50">
                      Mark as Mastered (+XP)
                    </button>
                    <button onClick={() => setIsRevisionModalOpen(false)} className="mt-4 text-sm text-slate-500 hover:text-white">
                      Cancel
                    </button>
                  </div>
                </div>
              )}
            </div>
          );
        }

        // Render the App
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
